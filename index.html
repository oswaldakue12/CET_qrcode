<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Soirée Jeux</title>
    <style>
        @keyframes colorChange {
            0% { background-color: #90EE90; }
            25% { background-color: #FFD700; }
            50% { background-color: #FFB6C1; }
            75% { background-color: #FFFFFF; }
            100% { background-color: #90EE90; }
        }

        body {
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', sans-serif;
            animation: colorChange 20s infinite;
        }

        .form-container {
            background: rgba(255, 255, 255, 0.9);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            width: 300px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            background-color: #2c3e50;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="form-container" id="container">
        <h2>Soirée jeux du 14 Novembre</h2>
        
        <form id="my-form" action="https://forminit.com/f/m3r9lmugmqd" method="POST">
            <input type="text" name="fi-sender-fullName" placeholder="Votre Nom" required>
            <input type="tel" name="fi-text-number" placeholder="Votre Numéro (Optionel)">
            <button type="submit" id="submit-btn">Confirmer ma participation</button>
        </form>
    </div>

    <script>
        const form = document.getElementById('my-form');
        const container = document.getElementById('container');

        form.addEventListener('submit', function(e) {
            e.preventDefault(); // Prevents the redirect
            
            const formData = new FormData(form);
            
            fetch(form.action, {
                method: 'POST',
                body: formData,
                headers: { 'Accept': 'application/json' }
            }).then(() => {
                // This replaces the form with your message
                container.innerHTML = "<h2>Ta participation est confirmée</h2>";
            });
        });
    </script>

</body>
</html>
